name: Build and Release Ubuntu RootFS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'console'
        type: choice
        options:
          - desktop
          - console
      create_release:
        description: 'Create release'
        required: false
        default: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set build parameters
        id: params
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            BUILD_TYPE=${{ github.event.inputs.build_type }}
            VERSION=${{ github.run_number }}
          else
            BUILD_TYPE=console
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          echo "build_type=${BUILD_TYPE}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Build type: ${BUILD_TYPE}"
          echo "Version: ${VERSION}"
      
      - name: Check host environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            wget \
            curl \
            debootstrap \
            qemu-user-static \
            binfmt-support \
            dosfstools \
            mtools \
            parted \
            fdisk \
            e2fsprogs \
            sudo \
            python3 \
            python3-pip
          
          sudo pip3 install pyelftools
          sudo ln -sf /usr/bin/python3 /usr/bin/python
      
      - name: Prepare sudo environment
        run: |
          sudo sed -i -e '/\%sudo/ c \%sudo ALL=(ALL) NOPASSWD: ALL' /etc/sudoers
          sudo usermod -a -G sudo $USER
      
      - name: Force clean previous build
        run: |
          cd ${{ github.workspace }}
          echo "Starting force cleanup of previous build artifacts..."
          
          # 强制卸载所有可能的挂载点（使用-l选项进行lazy卸载）
          echo "Unmounting mount points..."
          sudo umount -l binary/proc 2>/dev/null || echo "binary/proc not mounted or unmount failed"
          sudo umount -l binary/sys 2>/dev/null || echo "binary/sys not mounted or unmount failed"
          sudo umount -l binary/dev/pts 2>/dev/null || echo "binary/dev/pts not mounted or unmount failed"
          sudo umount -l binary/dev 2>/dev/null || echo "binary/dev not mounted or unmount failed"
          sudo umount -l binary 2>/dev/null || echo "binary not mounted or unmount failed"
          
          # 等待卸载完成
          sleep 2
          
          # 确认卸载状态
          echo "Verifying mount points..."
          mountpoint -q binary/proc && echo "WARNING: binary/proc still mounted" || echo "✓ binary/proc unmounted"
          mountpoint -q binary/sys && echo "WARNING: binary/sys still mounted" || echo "✓ binary/sys unmounted"
          mountpoint -q binary/dev/pts && echo "WARNING: binary/dev/pts still mounted" || echo "✓ binary/dev/pts unmounted"
          mountpoint -q binary/dev && echo "WARNING: binary/dev still mounted" || echo "✓ binary/dev unmounted"
          
          # 删除残留目录和文件
          echo "Removing previous build artifacts..."
          sudo rm -rf binary 2>/dev/null || echo "binary directory not found"
          sudo rm -rf rootfs 2>/dev/null || echo "rootfs directory not found"
          sudo rm -rf ubuntu-base-*.tar.gz 2>/dev/null || echo "ubuntu-base-*.tar.gz not found"
          sudo rm -rf ubuntu22.04.5-base-*.tar.gz 2>/dev/null || echo "ubuntu22.04.5-base-*.tar.gz not found"
          
          echo "Force cleanup completed successfully"
      
      - name: Create output directory
        run: |
          mkdir -p build-output
      
      - name: Build base rootfs
        run: |
          cd ${{ github.workspace }}
          export GUI=${{ steps.params.outputs.build_type }}
          echo "Building base Ubuntu rootfs with GUI=${GUI}"
          sudo -E bash ./mk-base-ubuntu.sh 2>&1 | tee build.log
      
      - name: Build Ubuntu rootfs with packages
        run: |
          cd ${{ github.workspace }}
          export GUI=${{ steps.params.outputs.build_type }}
          echo "Building Ubuntu rootfs with packages and drivers"
          sudo -E bash ./mk-ubuntu-rootfs.sh 2>&1 | tee -a build.log
      
      - name: Generate tarball
        run: |
          cd ${{ github.workspace }}
          echo "Generating ubuntu.tar.gz from rootfs"
          
          # 查找生成的rootfs目录
          ROOTFS_DIR=""
          if [ -d "rootfs" ]; then
            ROOTFS_DIR="rootfs"
          elif [ -d "ubuntu-rootfs" ]; then
            ROOTFS_DIR="ubuntu-rootfs"
          else
            # 尝试从构建脚本中找到的目录
            ROOTFS_DIR=$(find . -maxdepth 2 -type d -name "*rootfs*" 2>/dev/null | head -1)
          fi
          
          if [ -z "$ROOTFS_DIR" ] || [ ! -d "$ROOTFS_DIR" ]; then
            echo "Error: rootfs directory not found!"
            exit 1
          fi
          
          echo "Found rootfs directory: $ROOTFS_DIR"
          ls -lh "$ROOTFS_DIR" | head -20
          
          # 创建tar包，文件根目录直接包含ubuntu文件系统内容
          sudo tar -czf ubuntu.tar.gz -C "$ROOTFS_DIR" . 2>&1 | tee -a build.log
          
          # 修改所有权
          sudo chown $USER:$USER ubuntu.tar.gz
          ls -lh ubuntu.tar.gz
      
      - name: Verify tarball
        run: |
          cd ${{ github.workspace }}
          if [ -f ubuntu.tar.gz ]; then
            echo "Tarball verification:"
            tar -tzf ubuntu.tar.gz | head -20
            echo "..."
            echo "Total files in tarball:"
            tar -tzf ubuntu.tar.gz | wc -l
            echo "Tarball generated successfully!"
          else
            echo "Error: ubuntu.tar.gz not found!"
            exit 1
          fi
      
      - name: Generate checksum
        run: |
          cd ${{ github.workspace }}
          sha256sum ubuntu.tar.gz > ubuntu.tar.gz.sha256
          cat ubuntu.tar.gz.sha256
      
      - name: Create Release
        if: github.event_name == 'push' || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ubuntu.tar.gz
            ubuntu.tar.gz.sha256
            build.log
          body: |
            ## Build Information
            - **Version**: ${{ steps.params.outputs.version }}
            - **Build Type**: ${{ steps.params.outputs.build_type }}
            - **Build Date**: ${{ github.event.head_commit.timestamp }}
            - **Commit**: ${{ github.sha }}
            
            ## Files
            - `ubuntu.tar.gz` - Ubuntu Jammy RootFS tarball (根目录直接包含文件系统内容)
            - `ubuntu.tar.gz.sha256` - SHA256 checksum
            - `build.log` - Build output log
            
            ## Usage (使用方法)
            ```bash
            # 验证文件完整性
            sha256sum -c ubuntu.tar.gz.sha256
            
            # 解压到指定目录
            mkdir -p ubuntu-rootfs
            tar -xzf ubuntu.tar.gz -C ubuntu-rootfs
            
            # 或直接解压到当前目录
            tar -xzf ubuntu.tar.gz
            ```
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            ubuntu.tar.gz
            ubuntu.tar.gz.sha256
            build.log
          retention-days: 30
      
      - name: Clean up
        if: always()
        run: |
          cd ${{ github.workspace }}
          echo "Cleaning up build artifacts..."
          sudo -E bash ./clean-build.sh || true
